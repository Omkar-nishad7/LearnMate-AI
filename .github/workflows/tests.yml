name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: learnmate_test
          MYSQL_USER: learnmate
          MYSQL_PASSWORD: learnmate
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpass"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci_secret_key_xxxxxxxxxxxxxxxxxxxx
      JWT_SECRET_KEY: ci_jwt_key_yyyyyyyyyyyyyyyyyyyyyy
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
      DATABASE_SYNC_URL: sqlite:///./ci_test.db
      REDIS_URL: redis://localhost:6379/15
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - name: Release source preflight
        working-directory: .
        run: bash scripts/release_preflight.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.6.9
      - name: Lint (ruff)
        run: ruff check app
      - name: Run tests
        run: pytest -v
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts
          path: backend/.pytest_cache/
          if-no-files-found: ignore

  build-images:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t learnmate-backend:ci ./backend
      - name: Build worker image
        run: docker build -f ./backend/Dockerfile.worker -t learnmate-worker:ci ./backend
      - name: Build frontend production image
        run: docker build -t learnmate-frontend:ci ./frontend
      - name: Build database backup image
        run: docker build -f ./docker/backup.Dockerfile -t learnmate-backup:ci .
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Validate production Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
        env:
          SERVER_NAME: ci.example.com
          SECRET_KEY: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          JWT_SECRET_KEY: yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci
          DATABASE_URL: mysql+asyncmy://u:p@mysql:3306/learnmate
          DATABASE_SYNC_URL: mysql+pymysql://u:p@mysql:3306/learnmate
          REDIS_URL: redis://redis:6379/0
          GEMINI_API_KEY: ""
          FRONTEND_URL: https://ci.example.com
          STORAGE_PROVIDER: local
          SMTP_HOST: localhost
          SMTP_PORT: "587"
          SMTP_USERNAME: ""
          SMTP_PASSWORD: ""
          SMTP_FROM: ci@example.com
          YOUTUBE_API_KEY: ""

  e2e:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start stack and wait for readiness
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/SECRET_KEY=.*/SECRET_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx/' .env
          sed -i 's/JWT_SECRET_KEY=.*/JWT_SECRET_KEY=yyyyyyyyyyyyyyyyyyyyyyyyyy/' .env
          # Exercise the same HTTP reverse-proxy path used in deployment so /api/v1
          # requests reach FastAPI instead of the Next.js frontend.
          docker compose up -d --build mysql redis backend worker frontend nginx

          ready=0
          for i in $(seq 1 60); do
            mysql_health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_mysql 2>/dev/null || true)"
            backend_health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_backend 2>/dev/null || true)"
            frontend_health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_frontend 2>/dev/null || true)"
            worker_health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_worker 2>/dev/null || true)"
            nginx_health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_nginx 2>/dev/null || true)"
            if [[ "$mysql_health" == healthy && "$backend_health" == healthy && "$frontend_health" == healthy && "$worker_health" == healthy && "$nginx_health" == healthy ]] \
              && curl -fsS --max-time 5 http://127.0.0.1/health >/dev/null \
              && curl -fsS --max-time 10 http://127.0.0.1/ >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            docker compose ps >&2 || true
            docker compose logs --tail=200 mysql backend frontend redis worker nginx >&2 || true
            echo 'Database/backend did not become healthy in time.' >&2
            exit 1
          fi
          # These server-rendered routes are the pages exercised by the E2E suite.
          curl -fsS --max-time 10 http://127.0.0.1/login >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1/register >/dev/null
      - name: Install Playwright deps
        working-directory: tests/e2e
        run: |
          # The project does not currently track a package-lock.json.
          # npm install is therefore required until a lockfile is committed.
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: tests/e2e
        env:
          BASE_URL: http://localhost
        run: npx playwright test
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200