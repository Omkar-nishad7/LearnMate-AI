name: deploy-staging

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learnmate-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Opt in only after a separate staging host and its secrets are configured.
    if: >-
      vars.ENABLE_STAGING_DEPLOY == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Set deployment revision
        id: revision
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40,64}$ ]] || { echo "Expected a full tested commit SHA" >&2; exit 1; }
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "STAGING_SSH_PRIVATE_KEY is missing" >&2; exit 1; }
          test -n "$SSH_HOST" || { echo "STAGING_SSH_HOST is missing" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "STAGING_SSH_KNOWN_HOSTS is missing; pin the verified host key" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested revision to staging and verify
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "STAGING_SSH_USER is missing" >&2; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40,64}$ ]] || { echo "Invalid tested commit SHA" >&2; exit 1; }
          [[ "$DEPLOY_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "Invalid repository slug" >&2; exit 1; }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "DEPLOY_SHA='$DEPLOY_SHA' DEPLOY_REPOSITORY='$DEPLOY_REPOSITORY' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/learnmate-staging
          [[ "${DEPLOY_REPOSITORY:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo 'Invalid expected GitHub repository slug' >&2; exit 1; }
          [[ "${DEPLOY_SHA:-}" =~ ^[0-9a-f]{40,64}$ ]] || { echo 'Invalid tested commit SHA' >&2; exit 1; }

          CURRENT_ORIGIN="$(git remote get-url origin 2>/dev/null)" || { echo 'No Git origin configured in /opt/learnmate-staging' >&2; exit 1; }
          normalize_github_remote() {
            local remote="$1" normalized
            case "$remote" in
              https://github.com/*) normalized="${remote#https://github.com/}" ;;
              git@github.com:*) normalized="${remote#git@github.com:}" ;;
              ssh://git@github.com/*) normalized="${remote#ssh://git@github.com/}" ;;
              *) return 1 ;;
            esac
            normalized="${normalized%.git}"
            printf '%s' "$normalized"
          }
          ACTUAL_REPOSITORY="$(normalize_github_remote "$CURRENT_ORIGIN")" || { echo 'origin must be a direct HTTPS or SSH GitHub URL without embedded credentials' >&2; exit 1; }
          [[ "$ACTUAL_REPOSITORY" == "$DEPLOY_REPOSITORY" ]] || { echo "Staging origin '$ACTUAL_REPOSITORY' does not match '$DEPLOY_REPOSITORY'" >&2; exit 1; }

          test -f .env || { echo 'Missing staging .env' >&2; exit 1; }
          chmod 600 .env
          DOMAIN="$(sed -n 's/^SERVER_NAME=//p' .env | tail -n1 | tr -d '\"' | tr -d "'")"
          [[ -n "$DOMAIN" && "$DOMAIN" != CHANGE_ME_DOMAIN && "$DOMAIN" != localhost && "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Set a real staging SERVER_NAME in .env' >&2; exit 1; }
          test -s "nginx/conf.d/learnmate.https.conf" || { echo 'Bootstrap staging HTTPS before enabling staging deployment.' >&2; exit 1; }
          ! grep -q 'YOUR_DOMAIN' nginx/conf.d/learnmate.https.conf || { echo 'Staging HTTPS config contains template placeholders' >&2; exit 1; }
          test -s "certbot/conf/live/${DOMAIN}/fullchain.pem" || { echo 'Staging TLS certificate is missing' >&2; exit 1; }
          test -s "certbot/conf/live/${DOMAIN}/privkey.pem" || { echo 'Staging TLS private key is missing' >&2; exit 1; }

          PREVIOUS_SHA="$(git rev-parse HEAD)"
          git fetch origin "$DEPLOY_SHA"
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          printf '%s\n' "$PREVIOUS_SHA" > .previous-release
          chmod 600 .previous-release
          git reset --hard "$DEPLOY_SHA"
          bash scripts/validate_deploy_env.sh staging
          test -s "nginx/conf.d/learnmate.https.conf" || { echo 'HTTPS config missing at the tested revision' >&2; exit 1; }
          test -s "certbot/conf/live/${DOMAIN}/fullchain.pem" || { echo 'Staging TLS certificate is missing after checkout' >&2; exit 1; }
          test -s "certbot/conf/live/${DOMAIN}/privkey.pem" || { echo 'Staging TLS private key is missing after checkout' >&2; exit 1; }

          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build
          # Start stateful services first; the first deployment has no running database yet.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d mysql redis
          for i in $(seq 1 60); do
            if [[ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_mysql 2>/dev/null || true)" == healthy \
              && "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_redis 2>/dev/null || true)" == healthy ]]; then
              break
            fi
            if [[ "$i" == 60 ]]; then
              echo 'MySQL/Redis did not become healthy before backup/migration.' >&2
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=200 mysql redis >&2 || true
              exit 1
            fi
            sleep 5
          done
          # Keep a successful backup before database migrations.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps backup /usr/local/bin/backup_db.sh
          # Apply migrations as a one-off task to avoid racing the API entrypoint.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps --entrypoint alembic backend upgrade head
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

          for i in $(seq 1 60); do
            if [[ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_mysql 2>/dev/null || true)" == healthy \
              && "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_redis 2>/dev/null || true)" == healthy \
              && "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_worker 2>/dev/null || true)" == healthy \
              && "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_backend 2>/dev/null || true)" == healthy \
              && "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_frontend 2>/dev/null || true)" == healthy \
              && "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' learnmate_nginx 2>/dev/null || true)" == healthy ]] \
              && curl -fsS --max-time 5 "https://${DOMAIN}/health" >/dev/null \
              && curl -fsS --max-time 10 "https://${DOMAIN}/" >/dev/null; then
              echo "Staging deployment healthy: ${DEPLOY_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo 'Staging health checks failed. Review logs; do not blindly roll back DB schema changes.' >&2
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps >&2 || true
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=200 mysql redis worker backend frontend nginx >&2 || true
          exit 1
          REMOTE
