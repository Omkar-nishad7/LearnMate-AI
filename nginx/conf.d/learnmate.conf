# Local/dev HTTP entrypoint. Production HTTPS can be supplied by a separate
# compose override and server configuration.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 500m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Authentication API
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # File upload API
    location /api/v1/files {
        limit_req zone=upload_zone burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_common.conf;
        client_max_body_size 500m;
    }

    # AI API
    location /api/v1/ai/ {
        limit_req zone=api_zone burst=30 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # All other API endpoints
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # Backend health endpoint
    location = /health {
        proxy_pass http://backend:8000/api/v1/health;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # Next.js frontend
    location / {
        proxy_pass http://frontend:3000;
        include /etc/nginx/conf.d/proxy_common.conf;
    }
}